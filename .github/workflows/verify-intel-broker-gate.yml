name: Verify Intel-Mac broker gate

on:
  workflow_dispatch:

jobs:
  verify-intel-gate:
    # Real Intel (x86_64) macOS hardware -- no mocking. macos-15-intel is a
    # standard GitHub-hosted Intel runner (free/unlimited on public repos).
    runs-on: macos-15-intel
    steps:
      - name: Checkout (for verify script)
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: echo "uname -m = $(uname -m)"

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Uninstall any existing azure-cli
        run: brew uninstall --force azure-cli || true

      - name: Tap naga-nandyala/homebrew-mycli-app
        run: brew tap naga-nandyala/homebrew-mycli-app

      - name: Trust the tap
        run: brew trust --tap naga-nandyala/homebrew-mycli-app

      - name: Install azure-cli cask
        run: brew install --cask azure-cli

      - name: Enable broker on macOS flag
        run: az config set core.enable_broker_on_mac=true

      - name: Verify PR #926 Intel-Mac broker gate (real Intel, behavioral)
        run: |
          set -euo pipefail
          CASKROOM="$(brew --caskroom)/azure-cli"
          SP="$(find "$CASKROOM" -type d -path '*/site-packages' | head -1)"
          echo "Bundled site-packages: $SP"
          test -n "$SP" || { echo "site-packages not found"; exit 1; }
          test -f "$SP/msal/application.py" || { echo "msal/application.py not found"; exit 1; }

          # Behavioral test: import the SHIPPED msal and actually run the broker
          # decision on real Intel hardware. The gate must flip _enable_broker to
          # False and log the fallback warning.
          PY="$(brew --prefix python@3.14)/bin/python3.14"
          PYTHONPATH="$SP" "$PY" .github/scripts/verify_intel_broker_gate.py

      - name: End-to-end az login broker fallback (real Intel)
        run: |
          set -uo pipefail
          LOG="$(mktemp)"
          SENTINEL="Broker is not supported on Intel-based Macs."
          echo "Running 'az login --debug' with broker enabled (30s timeout; no input provided)..."
          # az login is interactive. gtimeout stops it after 30s. The broker
          # decision (and its warning) is emitted at MSAL app construction,
          # before any interactive prompt, so 30s is more than enough.
          gtimeout --signal=INT 30 az login --debug >"$LOG" 2>&1 || true

          echo "==== broker-related lines from az login --debug ===="
          grep -i "broker" "$LOG" || true
          echo "===================================================="

          if grep -q "$SENTINEL" "$LOG"; then
            echo "PASS: az login logged the fallback and continued on the non-broker path"
          else
            echo "FAIL: az login did NOT emit the Intel broker fallback warning"
            echo "---- log tail ----"
            tail -n 60 "$LOG"
            exit 1
          fi
